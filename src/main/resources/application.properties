# Configures Spring JPA to use an H2 in-memory database, commonly used for testing.
# Tables are automatically dropped when the application shuts down, allowing for easy resets during development.
# The DB_CLOSE_DELAY=-1 option keeps the database alive until the JVM shuts down.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;

# Specifies the JDBC driver class for the H2 database.
spring.datasource.driverClassName=org.h2.Driver

# Default credentials for the H2 database.
spring.datasource.username=sa
spring.datasource.password=password

# Ensures that Spring waits for the datasource to initialize before running any JPA-related logic.
spring.jpa.defer-datasource-initialization=true

# Defines the SQL dialect used by JPA. H2Dialect is appropriate for H2 databases.
# JPA and JPQL are compatible with multiple SQL dialects (e.g., PostgreSQL, MySQL), allowing for easier migration across databases.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Controls automatic schema generation behavior in Hibernate.
# Hibernate DDL Auto options:
# - none: No schema actions; mismatches between entities and tables may cause runtime issues.
# - validate: Verifies schema matches entities; application will fail to start if mismatches are found (often used in production).
# - update: Updates the schema to match entity definitions.
# - create: Creates tables based on entities.
# - create-drop: Creates tables at startup and drops them at shutdown (typically used for testing).
spring.jpa.hibernate.ddl-auto=create-drop

# Disables the default embedded Tomcat server since this is not a web application.
spring.main.web-application-type=none

# Disables LiveReload functionality provided by Spring DevTools.
spring.devtools.livereload.enabled=false

# Exposes all Spring Boot Actuator management endpoints over HTTP, typically for monitoring and debugging purposes.
management.endpoints.web.exposure.include=*